name: Build Forma iOS IPAname: Build Forma iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installa dipendenze di sistema con Homebrew
        run: |
          brew update
          brew install autoconf automake libtool pkg-config sdl2 sdl2_image sdl2_ttf sdl2_mixer

      - name: Installa kivy-ios e Cython
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install cython kivy-ios

      - name: Ripristina cache di kivy-ios
        uses: actions/cache@v4
        with:
          path: |
            build
            dist
          key: kivy-ios-arm64-v1

      - name: Compila Python3 e Kivy per iOS
        run: |
          toolchain build python3 kivy

      - name: Crea il progetto Xcode Forma
        run: |
          toolchain create Forma .

      - name: Compila l'app e genera l'IPA non firmato
        run: |
          cd forma-ios
          xcodebuild -project forma.xcodeproj \
            -scheme forma \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/forma.app Payload/
          zip -r ../Forma.ipa Payload

      - name: Carica il file Forma.ipa per il download
        uses: actions/upload-artifact@v4
        with:
          name: Forma-iOS-IPA
          path: Forma.ipa
